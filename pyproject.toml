[project]
name = "copark-mcp"
version = "0.1.0"
description = "Unofficial MCP server and CLI for CoPark guest parking permits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.20,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
copark-mcp = "copark_mcp:_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["copark_mcp.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
